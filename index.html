
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101820">
<meta name="description" content="Jogo de reflexos RD Games">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RD Games">
<title>RD Games - Reflexo</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101820;color:white;font-family:Arial,sans-serif;text-align:center}
header{padding:22px;color:#f5a623;font-size:28px;font-weight:bold}
main{padding:15px}
.score{font-size:22px;margin:15px}
#arena{position:relative;height:60vh;min-height:320px;background:#1d2c38;border:2px solid #f5a623;border-radius:18px;overflow:hidden;touch-action:manipulation}
#target{display:none;position:absolute;width:65px;height:65px;border-radius:50%;background:#f5a623;box-shadow:0 0 20px #f5a623;border:4px solid white;touch-action:manipulation}
button{background:#f5a623;color:#101820;border:0;padding:15px 30px;border-radius:12px;font-size:18px;font-weight:bold;margin:15px}
button:disabled{opacity:.6}
#message{font-size:18px;margin:15px}
</style>
</head>
<body>
<header>RD GAMES</header>
<main>
<h2>DESAFIO DE REFLEXO</h2>
<div class="score">Pontos: <span id="score">0</span> | Tempo: <span id="time">30</span>s</div>
<div id="arena"><div id="target"></div></div>
<button id="start">COMEÇAR JOGO</button>
<div id="message">Toque nos círculos o mais rápido possível!</div>
</main>
<script>
let score=0,time=30,playing=false,timer;
const target=document.getElementById("target");
const arena=document.getElementById("arena");
const scoreText=document.getElementById("score");
const timeText=document.getElementById("time");
const message=document.getElementById("message");
const start=document.getElementById("start");

function moveTarget(){
 const maxX=Math.max(0,arena.clientWidth-target.offsetWidth);
 const maxY=Math.max(0,arena.clientHeight-target.offsetHeight);
 target.style.left=Math.random()*maxX+"px";
 target.style.top=Math.random()*maxY+"px";
}
start.addEventListener("click",()=>{
 if(playing)return;
 score=0;time=30;playing=true;
 scoreText.textContent=score;
 timeText.textContent=time;
 message.textContent="VAI! ACERTE OS CÍRCULOS!";
 start.disabled=true;
 target.style.display="block";
 moveTarget();
 timer=setInterval(()=>{
  time--;
  timeText.textContent=time;
  if(time<=0){
   clearInterval(timer);
   playing=false;
   target.style.display="none";
   start.disabled=false;
   message.textContent="FIM DE JOGO! Você fez "+score+" pontos!";
  }
 },1000);
});
target.addEventListener("pointerdown",event=>{
 event.preventDefault();
 if(!playing)return;
 score++;
 scoreText.textContent=score;
 moveTarget();
});
if("serviceWorker" in navigator){
 window.addEventListener("load",()=>{
  navigator.serviceWorker.register("./sw.js").catch(console.error);
 });
}
</script>
</body>
</html>
